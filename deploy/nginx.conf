# nginx site config for the DG Property app.
#
# Install on the server with:
#   sudo cp deploy/nginx.conf /etc/nginx/conf.d/dg-property.conf
#   sudo sed -i 's/__DOMAIN__/your-real-domain.co.za/g' /etc/nginx/conf.d/dg-property.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then enable HTTPS — certbot rewrites this file to add the SSL block:
#   sudo certbot --nginx -d __DOMAIN__ -d www.__DOMAIN__

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__ www.__DOMAIN__;

    # Uploaded property/broker images can be large (multer allows up to 20 MB
    # per file, plus multi-image galleries) — allow generous request bodies.
    client_max_body_size 100M;

    # Everything is proxied to the frontend container. The frontend itself
    # forwards /api and /uploads to the backend over the internal network.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
